# LeadFlowX Scorer
# Updated to use centralized configuration and templates

version: '3.8'

services:
  leadflowx-scorer:
    build: .
    <<: *default-restart
    <<: *default-logging
    networks: *default-networks
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app:/app/src
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-leadflowx}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-LeadFlowX_SecurePassword_2025!}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:29092}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-LeadFlowX_Redis_2025!}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 2 * * *}
      - SCORING_WEIGHTS=${SCORING_WEIGHTS:-page_speed:0.3,ssl_score:0.2,lead_quality:0.5}
      - BATCH_SIZE=${BATCH_SIZE:-1000}
    ports:
      - "${SCORER_PORT:-8086}:${SCORER_INTERNAL_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:${SCORER_INTERNAL_PORT:-8080}/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  leadflowx-network:
    external: true
